<!doctype html><html><head><meta charset="utf-8"><style>
/* Link-preview card · 1200×630 (og:image / twitter:image) · subway signage, matching the site.
   Render: screenshot at 1200×630 in Chrome, save as ../social-card.jpg */
:root { --bg:#050505; --text:#f5f5f5; --dim:#bdbdbd; --sign:"Helvetica Neue", Helvetica, Arial, sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:630px; background:var(--bg); color:var(--text); font-family:var(--sign); overflow:hidden; position:relative; -webkit-font-smoothing:antialiased; }
body::before { content:""; position:absolute; left:0; right:430px; top:22px; height:3px; background:var(--text); }   /* the sign's white rule, up to the photo */   /* the sign's white rule */

/* Photo: a hard-edged panel bleeding off the top, right and bottom edges — no fade */
.photo { position:absolute; right:0; top:0; bottom:0; width:430px; background:url('../link_preview.jpg') center 18%/cover no-repeat; }

.bullet { display:inline-grid; place-items:center; flex:none; width:var(--b,40px); height:var(--b,40px); border-radius:50%;
          font-weight:700; font-size:calc(var(--b,40px)*.62); line-height:1; background:var(--c); color:var(--on); }
.blue { --c:#0062cf; --on:#fff; } .purple { --c:#b933ad; --on:#fff; } .yellow { --c:#fccc0a; --on:#0a0a0a; } .grey { --c:#6d6e71; --on:#fff; }

.text { position:absolute; left:72px; top:44px; bottom:0; width:660px; display:flex; flex-direction:column; justify-content:center; }
.status { align-self:flex-start; display:flex; align-items:center; gap:12px; font-size:19px; font-weight:700; letter-spacing:.06em; color:var(--text); margin-bottom:30px; }
.status i { width:10px; height:10px; border-radius:50%; background:#6cbe45; }
h1 { font-size:92px; line-height:.95; font-weight:700; letter-spacing:-.04em; }
.role { margin-top:20px; font-size:30px; font-weight:700; color:var(--dim); }
.routes { margin-top:24px; display:flex; flex-wrap:wrap; gap:12px 24px; }
.route { display:flex; align-items:center; gap:10px; font-size:26px; font-weight:500; }
.route .bullet { --b:34px; }
.desc { margin-top:24px; font-size:25px; color:#e6e6e6; line-height:1.4; }
.url { margin-top:26px; display:flex; align-items:center; gap:12px; font-size:25px; font-weight:500; color:var(--text); }
.url .avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1.5px #5a5a5a; }   /* memoji, as in the site logo; ring because its background is near-black */
</style></head><body>
<div class="photo"></div>
<div class="text">
  <div class="status"><i></i>PART-TIME FROM JAN 2027 · FULL-TIME FROM JUL 2027</div>
  <h1>Shravan<br>Chandra</h1>
  <div class="role">Machine Learning Engineer</div>
  <div class="routes">
    <span class="route"><span class="bullet blue">M</span>Production ML</span>
    <span class="route"><span class="bullet purple">G</span>Applied GenAI</span>
    <span class="route"><span class="bullet yellow">A</span>Accessible AI</span>
  </div>
  <div class="desc">Former Senior ML Engineer, Bosch · ~5 years<br>UBC Master of Data Science, June 2027</div>
  <div class="url"><img class="avatar" src="../memoji-128.jpg" alt="">shravnchandr.github.io</div>
</div></body></html>
