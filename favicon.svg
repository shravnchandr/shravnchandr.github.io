<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A black station sign: white rule near the top, "SC" in bold Helvetica.
       Faint outline so the edge holds on dark tab bars. -->
  <rect x="1" y="1" width="62" height="62" rx="9" fill="#0a0a0a" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="2" y="8" width="60" height="4" fill="#f5f5f5"/>
  <text x="32" y="53" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="-1.5">SC</text>
</svg>
